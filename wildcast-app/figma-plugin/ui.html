<meta charset="utf-8">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap');

  * { box-sizing: border-box; }
  :root {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --primary: #DF6F6D;
    --primary-dark: #C85A58;
    --primary-glow: rgba(223,111,109,0.12);
    --dark: #020618;
    --mid: #6B7280;
    --light: #9CA3AF;
    --border: #E5E7EB;
  }
  body {
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0; padding: 0;
    background: var(--surface);
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
  }
  .header {
    display: flex; align-items: center; gap: 8px;
    padding: 18px 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .header img { height: 26px; display: block; }
  .header .tag {
    margin-left: auto;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--primary); background: var(--primary-glow);
    padding: 3px 8px; border-radius: 100px;
  }
  .body { padding: 18px; }
  p.hint { font-size: 11.5px; color: var(--mid); margin: 0 0 18px; line-height: 1.6; }
  p.hint code {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 4px; font-size: 10.5px; font-family: ui-monospace, monospace; color: var(--dark);
  }
  label {
    display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--mid); margin-bottom: 6px;
  }
  select {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12.5px;
    padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 8px;
    margin-bottom: 16px; background: var(--surface); color: var(--dark);
    outline: none; cursor: pointer; transition: border-color 0.15s;
  }
  select:focus { border-color: var(--primary); }
  select:disabled { color: var(--light); cursor: default; }
  button {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13px; font-weight: 700;
    padding: 11px; border: none; border-radius: 8px;
    background: var(--primary); color: #fff; cursor: pointer; transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:disabled { background: var(--border); color: var(--light); cursor: not-allowed; }
  #status {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    font-size: 12px; line-height: 1.6; display: none;
  }
  #status.show { display: block; }
  #status.info { background: var(--bg); color: var(--mid); }
  #status.error { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
  #status.done { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
</style>

<div class="body">
  <p class="hint">Select one frame in Figma (with <code>zone:&lt;id&gt;</code> layers), pick a target slot, then Import. Lands as a draft — review and publish it from WildCast.</p>

  <label for="slot">Target slot</label>
  <select id="slot" disabled><option>Loading slots…</option></select>

  <button id="importBtn" disabled>Import to WildCast</button>
  <div id="status"></div>
</div>

<script>
  const slotSelect = document.getElementById('slot')
  const importBtn = document.getElementById('importBtn')
  const statusEl = document.getElementById('status')
  let slots = []

  function setStatus(text, kind) {
    if (!text) { statusEl.className = ''; statusEl.textContent = ''; return }
    statusEl.textContent = text
    statusEl.className = 'show ' + (kind || 'info')
  }

  window.onmessage = event => {
    const msg = event.data.pluginMessage
    if (!msg) return

    if (msg.type === 'slots') {
      slots = msg.slots
      slotSelect.innerHTML = ''
      if (!slots.length) {
        slotSelect.innerHTML = '<option value="">No empty slots left</option>'
        return
      }
      slotSelect.innerHTML = slots.map(s => `<option value="${s.slotKey}">${s.label}</option>`).join('')
      slotSelect.disabled = false
      importBtn.disabled = false
    }

    if (msg.type === 'slots-error') {
      setStatus('Could not load slot list: ' + msg.message, 'error')
    }

    if (msg.type === 'status') {
      setStatus(msg.message, 'info')
    }

    if (msg.type === 'error') {
      setStatus(msg.message, 'error')
      importBtn.disabled = false
    }

    if (msg.type === 'done') {
      const reviewNote = msg.needsReview.length
        ? ` — check font settings for: ${msg.needsReview.join(', ')}`
        : ''
      setStatus(`Imported "${msg.label}" as a draft${reviewNote}. Review and publish it in WildCast.`, 'done')
      importBtn.disabled = false
    }
  }

  importBtn.onclick = () => {
    const slot = slots.find(s => s.slotKey === slotSelect.value)
    if (!slot) return
    importBtn.disabled = true
    setStatus('Starting…', 'info')
    parent.postMessage({
      pluginMessage: {
        type: 'import',
        slotKey: slot.slotKey,
        label: slot.label,
        cat: slot.category,
        format: slot.format,
      },
    }, '*')
  }
</script>
